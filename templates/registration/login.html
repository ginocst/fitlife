{% extends "base.html" %}
{% block titulo %}Iniciar sesión | FitLife{% endblock%} 
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post" class="formulario">
  {% csrf_token %}
  {% if form.non_field_errors %}<p class="aviso error">Usuario o contraseña incorrectos.</p>{% endif %}
  <label>Usuario {{ form.username }}</label>
  <label>Contraseña {{ form.password }}</label>
  <input type="hidden" name="next" value="{{ next }}" />
  <button class="boton" type="submit">Entrar</button>
</form>
<p>¿Aún no eres socio? <a href="{% url 'registro' %}">Crea tu cuenta</a></p>
{% endblock %}
